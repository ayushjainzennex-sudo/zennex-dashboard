<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{color-scheme:light dark;--bg:#fff;--text:#1d1d1f;--muted:#6e6e73;--border:#d2d2d7;--accent:#ff3b30;--ok:#1f9d55}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--border:#3a3a3c;--ok:#30d158}}
  body{margin:0;width:300px;padding:14px 16px;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  h1{font-size:14px;margin:0 0 10px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .stats div{border:1px solid var(--border);border-radius:10px;padding:8px 10px}
  .stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted);font-size:12px}
  label{display:block;margin:10px 0 4px;font-weight:600;font-size:12px}
  input[type=url]{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:transparent;color:inherit}
  .row{display:flex;gap:8px;align-items:center;margin-top:12px}
  button{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:inherit;font-weight:600;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .err{color:var(--accent);font-size:12px;margin-top:8px}
  .ok{color:var(--ok)}
</style>
</head>
<body>
  <h1>Exact upload dates</h1>
  <div class="stats">
    <div><b id="done">–</b><span class="muted">dates saved</span></div>
    <div><b id="remaining">–</b><span class="muted">still estimated</span></div>
  </div>
  <div class="muted" id="status">–</div>
  <div class="err" id="error"></div>
  <label for="url">Dashboard address</label>
  <input type="url" id="url" placeholder="http://localhost:4173">
  <div class="row">
    <label style="margin:0;font-weight:500"><input type="checkbox" id="enabled"> Run in the background</label>
    <button class="primary" id="run" style="margin-left:auto">Run now</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
